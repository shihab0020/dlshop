<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="40" cy="40" r="40" fill="url(#bg)"/>
  <!-- Subtle top shine -->
  <ellipse cx="40" cy="20" rx="28" ry="14" fill="url(#shine)"/>

  <!-- Shopping bag body -->
  <rect x="16" y="30" width="48" height="34" rx="6" fill="white" opacity="0.96"/>

  <!-- Bag handle (left arc) -->
  <path d="M27 30 C27 18 53 18 53 30" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round"/>

  <!-- DL text inside bag -->
  <text x="40" y="55" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-weight="800" font-size="17"
        letter-spacing="1"
        fill="#4f46e5">DL</text>

  <!-- Small star / sparkle accent -->
  <circle cx="57" cy="27" r="4" fill="#fbbf24"/>
  <text x="57" y="31" text-anchor="middle" font-size="6" fill="white">★</text>
</svg>
